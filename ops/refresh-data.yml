name: Refresh live data
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily (Indian fuel prices revise at 06:00)
    - cron: "30 6 * * *"   # 12:00 IST retry
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch state fuel prices
        run: python3 scripts/update_fuel.py
      - name: Commit if changed
        run: |
          git config user.name "barfchalo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fuel.json
          git diff --cached --quiet || (git commit -m "Daily fuel price refresh" && git push)
